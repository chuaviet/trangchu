<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chùa Việt – Hà Nội</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Noto+Serif:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#141a2e;--panel:#1d2540;--ink:#f3ecdc;--mute:#9aa3c0;--gold:#e8b23a;--line:#303a5e;--red:#c44a3a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:"Noto Serif",Georgia,serif;font-weight:600;margin:0}
button,select,input{font:inherit}
.btn{background:var(--gold);color:#1a1405;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:20px;flex:1}
nav{display:flex;gap:6px}
.me{font-size:13px;color:var(--mute)}
.me b{color:var(--gold)}
main{height:calc(100% - 58px);overflow:auto}
.auth{max-width:380px;margin:6vh auto;padding:20px;background:var(--panel);border-radius:14px;display:grid;gap:10px}
.auth input,.auth select{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.err{color:#ff9c8f;font-size:13px;min-height:18px}
.split{display:grid;grid-template-columns:1fr 340px;height:100%}
#map{height:100%;min-height:300px}
.list{overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
.item{background:var(--panel);border-radius:12px;padding:12px;display:grid;gap:6px}
.item b{font-family:"Noto Serif",serif}
.item small{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.live{color:var(--gold)}
@media (max-width:760px){.split{grid-template-columns:1fr;grid-template-rows:42% 58%}}
.hist{max-width:640px;margin:0 auto;padding:16px;display:grid;gap:10px}
.total{font-size:30px;color:var(--gold);font-family:"Noto Serif",serif}
#hall{position:fixed;inset:0;background:#0d1226;z-index:1000}
#cv{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(#0d1226,transparent)}
.hud2{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hidden{display:none!important}
.btn.on{border-color:var(--gold);color:var(--gold)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:75%;overflow:auto;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:5;display:grid;gap:10px;max-width:640px;margin:0 auto}
#itx{white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:10px 18px;border-radius:20px;z-index:3000;font-weight:600}
/* form */
.form{max-width:520px;margin:0 auto;padding:16px;display:grid;gap:10px;align-content:start}
.form input,.form textarea,.item input,.item textarea{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
<h1>🪷 Chùa Việt · Hà Nội</h1>
<nav id="nav" class="hidden"><button class="btn o" data-v="map">Bản đồ</button><button class="btn o" data-v="hist">Lịch sử</button><button class="btn o" data-v="sug">Đề xuất chùa</button><button class="btn o hidden" data-v="adm" id="adm-b">Duyệt chùa</button></nav>
<span class="me hidden" id="me"></span>
<button class="btn o hidden" id="eid">Sửa ID</button>
<button class="btn o hidden" id="out">Đăng xuất</button>
</header>
<main>
<section id="auth" class="auth">
<h2>Vào chùa cùng mọi người</h2>
<input id="em" type="email" placeholder="Email" autocomplete="email">
<input id="pw" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="current-password">
<select id="pv"><option value="hanoi">Hà Nội</option><option disabled>Huế (sắp có)</option><option disabled>Đà Nẵng (sắp có)</option><option disabled>TP. Hồ Chí Minh (sắp có)</option></select>
<div class="err" id="err"></div>
<button class="btn" id="reg">Tạo tài khoản</button>
<button class="btn o" id="login">Đăng nhập</button>
<button class="btn o" id="goog">Tiếp tục với Google</button>
</section>
<section id="map-v" class="split hidden"><div id="map"></div><div class="list" id="list"></div></section>
<section id="hist-v" class="hist hidden"></section>
<section id="sug-v" class="form hidden">
<h2>Đề xuất một ngôi chùa</h2>
<input id="sn" placeholder="Tên chùa" maxlength="80">
<input id="sa" placeholder="Địa chỉ" maxlength="160">
<textarea id="sh" rows="4" placeholder="Lịch sử chùa (không bắt buộc)" maxlength="600"></textarea>
<textarea id="sp" rows="4" placeholder="Bài khấn (không bắt buộc)" maxlength="3000"></textarea>
<small class="me">Khi được duyệt: +50 điểm công đức, thêm +20 nếu có lịch sử, +20 nếu có bài khấn.</small>
<button class="btn o" id="pickb">📍 Chọn vị trí trên bản đồ</button>
<small id="llt" class="me">Chưa chọn vị trí</small>
<button class="btn" id="sgo">Gửi đề xuất</button>
<h2 style="margin-top:14px;font-size:17px">Đề xuất của bạn</h2><div id="mys" style="display:grid;gap:8px"></div>
</section>
<section id="adm-v" class="hist hidden"></section>
</main>
<div id="hall" class="hidden">
<canvas id="cv"></canvas>
<div class="hud"><div><h2 id="hn" style="font-size:18px"></h2><small id="hc" style="color:var(--mute)"></small></div><button class="btn" id="leave">Rời chùa</button></div>
<div class="hud2"><span id="tm" class="me" style="align-self:center"></span><button class="btn o" id="infob">📜 Lịch sử và bài khấn</button><button class="btn o" id="mus" aria-label="Bật hoặc tắt nhạc">🔊</button></div>
<div id="info" class="sheet hidden">
<div class="row"><button class="btn o on" id="ib-h">Lịch sử</button><button class="btn o" id="ib-p">Bài khấn</button><button class="btn o" id="ix" style="margin-left:auto">Đóng</button></div>
<div id="itx"></div>
<button class="btn" id="ipb"></button>
<div id="ibox" class="hidden" style="display:grid;gap:8px"><textarea id="ita" rows="6" placeholder="Nhập nội dung đề xuất (tối thiểu 20 ký tự)" style="padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%"></textarea><button class="btn" id="isend">Gửi đề xuất</button></div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,getDocs,updateDoc,increment,runTransaction,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {getDatabase,ref,set,remove,onValue,onDisconnect} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

/* ===== 1. CẤU HÌNH: dán thông tin Firebase của bạn vào đây ===== */
const CFG={apiKey:"AIzaSyDFMS650Ffj2_pwrqo_Vrj_T0j4kJXA6JI",authDomain:"chua-viet-2fc09.firebaseapp.com",databaseURL:"https://chua-viet-2fc09-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"chua-viet-2fc09",storageBucket:"chua-viet-2fc09.firebasestorage.app",messagingSenderId:"341352121438",appId:"1:341352121438:web:7a11aac3c0c4fbd7e920cf"};

/* Tùy chọn: file mô hình nhân vật 3D (.glb) đặt trong repo, ví dụ "assets/avatar.glb". Để trống = dùng nhân vật có sẵn. */
const AVATAR_GLB="";
/* Tùy chọn: file nhạc nền (.mp3) của bạn, ví dụ "assets/nhac.mp3". Để trống = nhạc chuông bát và âm nền êm do trình duyệt tự tạo. */
const MUSIC_URL="";

/* ===== 2. DỮ LIỆU CHÙA HÀ NỘI (toạ độ gần đúng, hãy kiểm tra lại) ===== */
const TEMPLES=[
{id:"hn-mot-cot",n:"Chùa Một Cột",lat:21.0359,lng:105.8334,h:"Xây năm 1049 thời vua Lý Thái Tông, kiến trúc như đóa sen nở trên mặt hồ."},
{id:"hn-tran-quoc",n:"Chùa Trấn Quốc",lat:21.0482,lng:105.8369,h:"Nằm bên Hồ Tây, có nguồn gốc từ thế kỷ VI, một trong những chùa cổ nhất Thăng Long."},
{id:"hn-quan-su",n:"Chùa Quán Sứ",lat:21.0227,lng:105.8450,h:"Chùa giữa phố cổ, là nơi đặt trụ sở Trung ương Giáo hội Phật giáo Việt Nam."},
{id:"hn-lang",n:"Chùa Láng",lat:21.0230,lng:105.8010,h:"Ngôi chùa cổ ở quận Đống Đa, gắn với thiền sư Từ Đạo Hạnh."},
{id:"hn-thay",n:"Chùa Thầy",lat:21.0124,lng:105.6307,h:"Chùa ở chân núi Sài Sơn (Quốc Oai), nổi tiếng với thủy đình bên hồ."},
{id:"hn-tay-phuong",n:"Chùa Tây Phương",lat:21.0187,lng:105.5712,h:"Chùa cổ trên đồi Câu Lâu (Thạch Thất), có bộ tượng La Hán nổi tiếng."}
];
const PTS={temple:50,history:20,prayer:20};
let T=Object.fromEntries(TEMPLES.map(t=>[t.id,t]));let temples=[...TEMPLES];const mk={};let unT=null,isAdm=false;

/* ===== 3. LỚP DỮ LIỆU (Store): muốn chuyển sang hệ thống khác chỉ cần viết lại khối này ===== */
const app=initializeApp(CFG),auth=getAuth(app),fs=getFirestore(app),rt=getDatabase(app);
const Store={
 async profile(u){const s=await getDoc(doc(fs,"users",u));return s.exists()?s.data():null},
 async createProfile(u,p){await setDoc(doc(fs,"users",u),p)},
 reserve(u,code){const r=doc(fs,"codes",code.toLowerCase());return runTransaction(fs,async tx=>{if((await tx.get(r)).exists())return false;tx.set(r,{uid:u});return true})},
 async setCode(u,old,nw){const same=nw.toLowerCase()==old.toLowerCase();if(!same&&!(await this.reserve(u,nw)))return false;await updateDoc(doc(fs,"users",u),{code:nw,codeAt:Date.now()});if(!same)await deleteDoc(doc(fs,"codes",old.toLowerCase()));return true},
 suggest(s){return addDoc(collection(fs,"suggestions"),s)},
 async sugs(q){const s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}))},
 mySugs(u){return this.sugs(query(collection(fs,"suggestions"),where("uid","==",u)))},
 pendingSugs(){return this.sugs(query(collection(fs,"suggestions"),where("status","==","pending")))},
 async decide(sg,ok,d){if(ok){await setDoc(doc(fs,"temples",d.id),{n:d.n,addr:d.addr,h:d.h,p:d.p,lat:sg.lat,lng:sg.lng,province:sg.province,from:sg.uid,at:Date.now()});await this.award(sg.uid,PTS.temple+(d.h?PTS.history:0)+(d.p?PTS.prayer:0),"temple",d.n)}await updateDoc(doc(fs,"suggestions",sg.id),{status:ok?"approved":"rejected"})},
 contrib(c){return addDoc(collection(fs,"contribs"),c)},
 myContribs(u){return this.sugs(query(collection(fs,"contribs"),where("uid","==",u)))},
 pendingContribs(){return this.sugs(query(collection(fs,"contribs"),where("status","==","pending")))},
 myMerits(u){return this.sugs(query(collection(fs,"merits"),where("uid","==",u)))},
 async award(uid,pts,kind,name){await addDoc(collection(fs,"merits"),{uid,kind,t:name,points:pts,at:Date.now()});await updateDoc(doc(fs,"users",uid),{points:increment(pts)})},
 async decideC(c,ok,text){if(ok){await setDoc(doc(fs,"temples",c.templeId),{[c.kind=="history"?"h":"p"]:text},{merge:true});await this.award(c.uid,PTS[c.kind],c.kind,c.t)}await updateDoc(doc(fs,"contribs",c.id),{status:ok?"approved":"rejected"})},
 watchTemples(cb){return onSnapshot(collection(fs,"temples"),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))))},
 async isAdmin(u){return (await getDoc(doc(fs,"admins",u))).exists()},
 async addVisit(v){await addDoc(collection(fs,"visits"),v);await updateDoc(doc(fs,"users",v.uid),{points:increment(v.points)})},
 async visits(u){const s=await getDocs(query(collection(fs,"visits"),where("uid","==",u)));return s.docs.map(d=>d.data()).sort((a,b)=>b.start-a.start)},
 enter(tid,u,code){const r=ref(rt,`presence/${tid}/${u}`);set(r,{code,ts:Date.now()});onDisconnect(r).remove();return r},
 leave(r){return remove(r)},
 watch(path,cb){return onValue(ref(rt,path),s=>cb(s.val()||{}))}
};

/* ===== 4. TIỆN ÍCH ===== */
const $=id=>document.getElementById(id);
const toast=m=>{const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)};
const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
let user=null,prof=null,counts={},pos=null,hallState=null,map=null;

/* ===== NHẠC NỀN ===== */
let au=null,muted=false;
function startMusic(){
 if(!au){
  if(MUSIC_URL){const a=new Audio(MUSIC_URL);a.loop=true;a.volume=.45;au={play(){a.play().catch(()=>{})},stop(){a.pause()},mute(m){a.muted=m}}}
  else{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
   const ctx=new C(),master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination);
   const dg=ctx.createGain();dg.gain.value=.06;dg.connect(master);
   [110,164.81,220].forEach((f,i)=>{const o=ctx.createOscillator();o.type="sine";o.frequency.value=f;o.detune.value=(i-1)*4;o.connect(dg);o.start()});
   const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.12;lg.gain.value=.03;lfo.connect(lg);lg.connect(dg.gain);lfo.start();
   const notes=[220,277.18,329.63,440,554.37];let tm;
   const bowl=()=>{const f=notes[Math.floor(Math.random()*notes.length)],t=ctx.currentTime,g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+7);g.connect(master);
    [[1,1],[2.76,.35],[5.4,.12]].forEach(([m,v])=>{const o=ctx.createOscillator(),og=ctx.createGain();o.frequency.value=f*m;og.gain.value=v;o.connect(og);og.connect(g);o.start(t);o.stop(t+7.5)})};
   const loop=()=>{bowl();tm=setTimeout(loop,8000+Math.random()*6000)};
   au={play(){ctx.resume();clearTimeout(tm);loop()},stop(){clearTimeout(tm);ctx.suspend()},mute(m){master.gain.value=m?0:.5}}}
 }
 au.mute(muted);au.play();
}

/* ===== 5. ĐĂNG NHẬP ===== */
const errMsg=e=>({"auth/invalid-credential":"Sai email hoặc mật khẩu.","auth/email-already-in-use":"Email này đã có tài khoản.","auth/weak-password":"Mật khẩu cần ít nhất 6 ký tự.","auth/invalid-email":"Email không hợp lệ.","auth/unauthorized-domain":"Tên miền web chưa được thêm vào Authorized domains trong Firebase.","auth/operation-not-allowed":"Chưa bật phương thức đăng nhập này trong Firebase Authentication.","auth/popup-blocked":"Trình duyệt đang chặn cửa sổ đăng nhập, hãy cho phép popup.","auth/popup-closed-by-user":"Bạn đã đóng cửa sổ đăng nhập.","auth/network-request-failed":"Lỗi mạng, hãy thử lại."}[e.code]||("Không đăng nhập được ("+(e.code||e.message)+"). Kiểm tra lại cấu hình Firebase."));
const run=f=>async()=>{$("err").textContent="";try{await f()}catch(e){$("err").textContent=errMsg(e)}};
$("reg").onclick=run(()=>createUserWithEmailAndPassword(auth,$("em").value,$("pw").value));
$("login").onclick=run(()=>signInWithEmailAndPassword(auth,$("em").value,$("pw").value));
$("goog").onclick=run(()=>signInWithPopup(auth,new GoogleAuthProvider()));
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 user=u;
 if(!u){unT&&unT();unT=null;["nav","me","out","eid","map-v","hist-v","sug-v","adm-v"].forEach(i=>$(i).classList.add("hidden"));$("auth").classList.remove("hidden");return}
 prof=await Store.profile(u.uid);
 if(!prof){let c;for(let i=0;i<8;i++){c="PT-"+(10000+Math.floor(Math.random()*89999));if(await Store.reserve(u.uid,c))break}
  prof={code:c,province:$("pv").value,points:0,createdAt:Date.now()};await Store.createProfile(u.uid,prof)}
 isAdm=await Store.isAdmin(u.uid).catch(()=>false);$("adm-b").classList.toggle("hidden",!isAdm);
 unT=Store.watchTemples(setTemples,()=>{});
 $("auth").classList.add("hidden");["nav","me","out","eid"].forEach(i=>$(i).classList.remove("hidden"));
 showMe();show("map");
});
const showMe=()=>{$("me").innerHTML=`ID <b>${prof.code}</b> · <b>${prof.points}</b> điểm công đức`};

/* ===== 6. BẢN ĐỒ HÀ NỘI ===== */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){for(const k of ["map","hist","sug","adm"])$(k+"-v").classList.toggle("hidden",k!=v);if(v=="map")initMap();if(v=="hist")loadHist();if(v=="sug")sugView();if(v=="adm")loadAdm()}
function setTemples(list){const by=Object.fromEntries(list.map(x=>[x.id,x]));temples=[...TEMPLES.map(b=>({...b,...(by[b.id]||{})})),...list.filter(x=>!TEMPLES.some(b=>b.id==x.id)&&x.lat!=null)];T=Object.fromEntries(temples.map(t=>[t.id,t]));syncMarkers();if(map)drawList();if(hallState&&!$("info").classList.contains("hidden"))drawInfo()}
function syncMarkers(){if(!map)return;temples.forEach(t=>{if(!mk[t.id])mk[t.id]=L.marker([t.lat,t.lng]).addTo(map).bindTooltip(t.n)})}
function initMap(){
 if(!map){
  map=L.map("map").setView([21.03,105.84],11);
  const carto=L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19,referrerPolicy:"origin",attribution:"© OpenStreetMap © CARTO"}).addTo(map);
  let bad=0;carto.on("tileerror",()=>{if(++bad==4){map.removeLayer(carto);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,referrerPolicy:"origin",attribution:"© OpenStreetMap"}).addTo(map)}});
  syncMarkers();map.on("click",onMapClick);
  Store.watch("presence",d=>{counts={};for(const k in d)counts[k]=Object.keys(d[k]).length;drawList()});
  navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];drawList()},()=>{});
 }
 setTimeout(()=>map.invalidateSize(),50);drawList();
}
function drawList(){
 const L2=$("list");L2.textContent="";
 const arr=temples.map(t=>({...t,d:pos?km(pos[0],pos[1],t.lat,t.lng):null})).sort((a,b)=>pos?a.d-b.d:0);
 arr.forEach(t=>{
  const e=document.createElement("div");e.className="item";
  const n=counts[t.id]||0;
  e.innerHTML=`<b></b><small></small><div class="live">● ${n} người đang ở chùa</div><div class="row"><button class="btn">Vào chùa</button><a class="btn o" target="_blank" rel="noopener">Chỉ đường</a></div>`;
  e.querySelector("b").textContent=t.n;
  e.querySelector("small").textContent=(t.d!=null?t.d.toFixed(1)+" km · ":"")+t.h;
  e.querySelector("a").href=`https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lng}`;
  e.querySelector("button").onclick=()=>{startMusic();enterHall(t)};
  e.onmouseenter=()=>map.panTo([t.lat,t.lng]);
  L2.appendChild(e)});
}

/* ===== 7. SẢNH CHÙA 3D + NGƯỜI THẬT ===== */
function label(txt,gold){
 const c=document.createElement("canvas");c.width=256;c.height=64;const x=c.getContext("2d");
 x.fillStyle=gold?"#e8b23a":"rgba(20,26,46,.85)";x.beginPath();x.roundRect(8,8,240,48,24);x.fill();
 x.fillStyle=gold?"#1a1405":"#f3ecdc";x.font="600 28px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(txt,128,33);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(1.6,.4,1);s.position.y=1.9;return s}
const M=(c,o)=>new THREE.MeshLambertMaterial({color:c,...o});
const ML=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};
function fitTo(o,h,w){const g=new THREE.Group();g.add(o);let b=new THREE.Box3().setFromObject(o);const s=b.getSize(new THREE.Vector3());o.scale.multiplyScalar(w?w/Math.max(s.x,s.z):h/s.y);b.setFromObject(o);o.position.set(-(b.min.x+b.max.x)/2,-b.min.y,-(b.min.z+b.max.z)/2);return g}
let AVM=null;if(AVATAR_GLB)new GLTFLoader().loadAsync(AVATAR_GLB).then(g=>AVM=g.scene).catch(()=>{});
function monk(){
 const g=new THREE.Group(),robe=M(0xe2862a),skin=M(0xf1cfa5);
 const lap=ML(new THREE.SphereGeometry(.62,20,12),robe,0,.42,0);lap.scale.set(1,.55,.9);
 g.add(lap,ML(new THREE.CylinderGeometry(.24,.4,.75,18),robe,0,.95,0),ML(new THREE.SphereGeometry(.27,20,16),skin,0,1.58,0),
  ML(new THREE.SphereGeometry(.1,10,8),skin,0,.62,.42),ML(new THREE.SphereGeometry(.2,14,10),M(0xb85f1c),0,1.3,0));
 return g}
function avatar(uid,code,mine){
 const g=new THREE.Group();
 g.add(AVM?fitTo(AVM.clone(true),1.7):monk());
 g.add(ML(new THREE.CylinderGeometry(.62,.7,.12,24),M(0xd96a8a),0,.06,0));
 for(let i=0;i<8;i++){const a=i/8*6.283,p=ML(new THREE.SphereGeometry(.2,10,8),M(0xf0a0b8),Math.cos(a)*.7,.12,Math.sin(a)*.7);p.scale.set(1,.45,.6);p.rotation.y=-a;g.add(p)}
 if(mine){const r=ML(new THREE.TorusGeometry(.9,.04,8,32),new THREE.MeshBasicMaterial({color:0xe8b23a}),0,.05,0);r.rotation.x=Math.PI/2;g.add(r)}
 g.add(label(code,mine));g.children[g.children.length-1].position.y=2.1;
 const h=hash(uid),a=(h%360)*Math.PI/180,r=2.4+((h>>9)%4)*1.1;
 g.position.set(Math.cos(a)*r,0,Math.sin(a)*r+1.5);return g}
function procTemple(){
 const g=new THREE.Group(),red=M(0x8a2f25),gold=M(0xc99a2e),dark=M(0x4a1f1a);
 g.add(ML(new THREE.BoxGeometry(6.6,.3,3.8),M(0x7d7468),0,.15,0),ML(new THREE.BoxGeometry(4.6,1.8,2.6),red,0,1.2,0));
 for(const x of[-2,-.8,.8,2])g.add(ML(new THREE.CylinderGeometry(.14,.14,1.8,12),gold,x,1.2,1.5));
 g.add(ML(new THREE.BoxGeometry(1,1.4,.1),new THREE.MeshBasicMaterial({color:0xf0b84a}),0,1,1.32));
 const r1=ML(new THREE.ConeGeometry(3.7,1.2,4),dark,0,2.7,0);r1.rotation.y=Math.PI/4;r1.scale.z=.78;
 const r2=ML(new THREE.ConeGeometry(2.6,1.1,4),dark,0,4.65,0);r2.rotation.y=Math.PI/4;r2.scale.z=.78;
 g.add(r1,ML(new THREE.BoxGeometry(3,.8,2),red,0,3.7,0),r2,ML(new THREE.SphereGeometry(.16,12,10),gold,0,5.35,0));
 for(const x of[-2.8,2.8]){g.add(ML(new THREE.SphereGeometry(.22,12,10),new THREE.MeshBasicMaterial({color:0xffb050}),x,1.4,1.9));const l=new THREE.PointLight(0xffb050,1.2,9);l.position.set(x,1.5,2);g.add(l)}
 return g}
function buildScene(t){
 const sc=new THREE.Scene();sc.background=new THREE.Color(0x0d1226);sc.fog=new THREE.Fog(0x0d1226,16,40);
 sc.add(new THREE.HemisphereLight(0xffe2b0,0x1a2040,1));
 const dl=new THREE.DirectionalLight(0xffd9a0,.7);dl.position.set(3,6,4);sc.add(dl);
 let o=ML(new THREE.CircleGeometry(16,48),M(0x24301f),0,0,0);o.rotation.x=-Math.PI/2;sc.add(o);
 o=ML(new THREE.CircleGeometry(8,48),M(0x6b5a48),0,.01,0);o.rotation.x=-Math.PI/2;sc.add(o);
 const dec=new THREE.Group(),p=[];
 for(let i=0;i<300;i++){const a=Math.random()*6.283;p.push(Math.cos(a)*30,5+Math.random()*16,Math.sin(a)*30)}
 dec.add(new THREE.Points(new THREE.BufferGeometry().setAttribute("position",new THREE.Float32BufferAttribute(p,3)),new THREE.PointsMaterial({color:0xfff2cc,size:.15,fog:false})));
 dec.add(ML(new THREE.SphereGeometry(1.6,24,16),new THREE.MeshBasicMaterial({color:0xfff1c9,fog:false}),-12,13,-26));
 for(let i=0;i<9;i++){const a=i/9*6.283;dec.add(ML(new THREE.ConeGeometry(5+Math.random()*3,7+Math.random()*5,5),M(0x1b2340),Math.cos(a)*24,3,Math.sin(a)*24))}
 sc.add(dec);
 for(let i=0;i<14;i++){const a=(i+Math.random()*.6)/14*6.283,r=10+Math.random()*2.5,tr=new THREE.Group();
  tr.add(ML(new THREE.CylinderGeometry(.12,.16,1,8),M(0x4a3426),0,.5,0),ML(new THREE.ConeGeometry(.9,1.8,8),M(0x1f4a33),0,1.7,0),ML(new THREE.ConeGeometry(.65,1.4,8),M(0x2a5d41),0,2.7,0));
  tr.position.set(Math.cos(a)*r,0,Math.sin(a)*r);sc.add(tr)}
 const tp=procTemple();tp.position.z=-4.8;sc.add(tp);
 const T2=T[t.id]||t;
 if(T2.bg)new THREE.TextureLoader().loadAsync(T2.bg).then(x=>{x.mapping=THREE.EquirectangularReflectionMapping;x.colorSpace=THREE.SRGBColorSpace;sc.background=x;sc.fog=null;sc.remove(dec)}).catch(()=>{});
 if(T2.model)new GLTFLoader().loadAsync(T2.model).then(g=>{sc.remove(tp);const m=fitTo(g.scene,0,6.5);m.position.z=-4.8;sc.add(m)}).catch(()=>{});
 return sc}
async function enterHall(t){
 const mine=await Store.visits(user.uid),today=new Date().setHours(0,0,0,0);
 const earned=mine.filter(v=>v.start>=today).reduce((s,v)=>s+v.points,0);
 const r=Store.enter(t.id,user.uid,prof.code);
 $("hall").classList.remove("hidden");$("hn").textContent=t.n;
 const cv=$("cv"),rd=new THREE.WebGLRenderer({canvas:cv,antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));
 const sc=buildScene(t);
 const cam=new THREE.PerspectiveCamera(55,1,.1,60);let az=0,el=.45,dist=10,drag=null;
 const place=()=>{cam.position.set(Math.sin(az)*dist*Math.cos(el),dist*Math.sin(el)+1,Math.cos(az)*dist*Math.cos(el)+1);cam.lookAt(0,1.8,-.5)};
 cv.onpointerdown=e=>drag=[e.clientX,e.clientY];cv.onpointerup=()=>drag=null;
 cv.onpointermove=e=>{if(!drag)return;az-=(e.clientX-drag[0])*.006;el=Math.max(.15,Math.min(1.2,el+(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY]};
 const fit=()=>{rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();dist=cam.aspect<1?14:10};
 addEventListener("resize",fit);fit();
 const av={};
 const un=Store.watch(`presence/${t.id}`,d=>{
  for(const u in av)if(!d[u]){sc.remove(av[u]);delete av[u]}
  for(const u in d)if(!av[u]){av[u]=avatar(u,d[u].code,u==user.uid);sc.add(av[u])}
  $("hc").textContent=Object.keys(d).length+" người đang có mặt"});
 const t0=Date.now();let raf;
 const loop=()=>{raf=requestAnimationFrame(loop);if(!drag)az+=.0008;place();rd.render(sc,cam);
  const s=Math.floor((Date.now()-t0)/1000);$("tm").textContent=`Đã ở chùa ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
 loop();
 hallState={r,t,t0,earned,stop(){cancelAnimationFrame(raf);un();removeEventListener("resize",fit);rd.dispose()}};
}
$("leave").onclick=leaveHall;
addEventListener("pagehide",()=>{if(hallState)Store.leave(hallState.r)});
async function leaveHall(){
 const h=hallState;if(!h)return;hallState=null;h.stop();au&&au.stop();await Store.leave(h.r);
 $("hall").classList.add("hidden");$("info").classList.add("hidden");
 const mins=Math.floor((Date.now()-h.t0)/60000);
 /* Quy tắc điểm: 10 điểm khi ở đủ 1 phút, +2 điểm mỗi phút (tối đa 20 phút), tối đa 100 điểm/ngày */
 let pts=mins<1?0:10+Math.min(mins,20)*2;pts=Math.max(0,Math.min(pts,100-h.earned));
 if(mins>=1){await Store.addVisit({uid:user.uid,templeId:h.t.id,start:h.t0,end:Date.now(),mins,points:pts});prof.points+=pts;showMe();
  toast(pts?`+${pts} điểm công đức. A Di Đà Phật!`:"Hôm nay bạn đã đạt tối đa điểm công đức.")}
}

/* ===== 9. SỬA ID ===== */
const OK=/^[A-Za-z0-9_.-]{3,16}$/;
$("eid").onclick=async()=>{
 if(hallState)return toast("Hãy rời chùa trước khi đổi ID");
 if(Date.now()-(prof.codeAt||0)<6048e5)return toast("Mỗi 7 ngày chỉ đổi ID được 1 lần");
 const v=(prompt("ID mới (3–16 ký tự: chữ, số, _ . -)",prof.code)||"").trim();
 if(!v||v==prof.code)return;
 if(!OK.test(v)||/admin|quantri/i.test(v))return toast("ID không hợp lệ");
 try{if(await Store.setCode(user.uid,prof.code,v)){prof.code=v;prof.codeAt=Date.now();showMe();toast("Đã đổi ID")}else toast("ID này đã có người dùng")}catch(e){toast("Không đổi được ID")}};

/* ===== 10. ĐỀ XUẤT CHÙA ===== */
let pick=false,pickLL=null,pickMk=null;
$("pickb").onclick=()=>{pick=true;show("map");toast("Bấm vào bản đồ để chọn vị trí chùa")};
function onMapClick(e){if(!pick)return;pick=false;pickLL=e.latlng;if(pickMk)pickMk.remove();pickMk=L.marker(e.latlng,{opacity:.6}).addTo(map);
 $("llt").textContent=`Đã chọn vị trí: ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;show("sug")}
$("sgo").onclick=async()=>{
 const n=$("sn").value.trim(),h=$("sh").value.trim();
 if(n.length<3)return toast("Hãy nhập tên chùa");
 if(!pickLL)return toast("Hãy chọn vị trí trên bản đồ");
 try{await Store.suggest({uid:user.uid,n,addr:$("sa").value.trim(),h,p:$("sp").value.trim(),lat:pickLL.lat,lng:pickLL.lng,province:"hanoi",status:"pending",createdAt:Date.now()});
  ["sn","sa","sh","sp"].forEach(i=>$(i).value="");pickLL=null;if(pickMk)pickMk.remove();$("llt").textContent="Chưa chọn vị trí";toast("Đã gửi, chờ duyệt");sugView()}
 catch(e){toast("Không gửi được, thử lại sau")}};
const ST={pending:"Chờ duyệt",approved:"Đã duyệt",rejected:"Không được duyệt"};
async function sugView(){
 const box=$("mys");box.textContent="Đang tải…";
 const [a,b]=await Promise.all([Store.mySugs(user.uid),Store.myContribs(user.uid)]);
 const l=[...a.map(s=>({t:"Chùa mới: "+s.n,st:s.status,at:s.createdAt})),...b.map(c=>({t:(c.kind=="history"?"Lịch sử":"Bài khấn")+" · "+c.t,st:c.status,at:c.createdAt}))].sort((x,y)=>y.at-x.at);box.textContent="";
 if(!l.length)box.textContent="Bạn chưa có đề xuất nào.";
 l.forEach(s=>{const e=document.createElement("div");e.className="item";e.innerHTML="<b></b><small></small>";e.querySelector("b").textContent=s.t;e.querySelector("small").textContent=ST[s.st]||s.st;box.appendChild(e)})}

/* ===== 11. QUẢN TRỊ: DUYỆT CHÙA ===== */
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
async function loadAdm(){
 const box=$("adm-v");box.textContent="Đang tải…";
 let a,c;try{[a,c]=await Promise.all([Store.pendingSugs(),Store.pendingContribs()])}catch(e){box.textContent="Bạn không có quyền duyệt.";return}
 box.textContent="";const h=document.createElement("h2");h.textContent=`Chờ duyệt (${a.length+c.length})`;box.appendChild(h);
 const card=html=>{const e=document.createElement("div");e.className="item";e.innerHTML=html;box.appendChild(e);return e};
 const btns='<div class="row"><button class="btn ok">Duyệt và đăng</button><button class="btn o no">Từ chối</button></div>';
 const wire=(e,fn)=>{[true,false].forEach(ok=>e.querySelector(ok?".ok":".no").onclick=async()=>{try{await fn(ok);e.remove();toast(ok?"Đã duyệt":"Đã từ chối")}catch(x){toast("Thao tác thất bại")}})};
 a.forEach(s=>{const e=card('<b>Chùa mới</b><input class="n"><input class="a"><textarea class="d" rows="3" placeholder="Lịch sử"></textarea><textarea class="p" rows="3" placeholder="Bài khấn"></textarea><small></small>'+btns);
  e.querySelector(".n").value=s.n;e.querySelector(".a").value=s.addr||"";e.querySelector(".d").value=s.h||"";e.querySelector(".p").value=s.p||"";
  e.querySelector("small").textContent=`Vị trí: ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)} · người gửi ${s.uid.slice(0,6)}`;
  wire(e,ok=>{const n=e.querySelector(".n").value.trim();if(!n){toast("Thiếu tên chùa");throw 0}
   return Store.decide(s,ok,{id:"hn-"+slug(n)+"-"+Math.random().toString(36).slice(2,5),n,addr:e.querySelector(".a").value.trim(),h:e.querySelector(".d").value.trim(),p:e.querySelector(".p").value.trim()})})});
 c.forEach(x=>{const e=card('<b></b><small></small><textarea class="d" rows="6"></textarea>'+btns);
  const f=x.kind=="history"?"h":"p",cur=(T[x.templeId]||{})[f];
  e.querySelector("b").textContent=(x.kind=="history"?"Lịch sử":"Bài khấn")+" · "+x.t;
  e.querySelector("small").textContent=cur?"Hiện có: "+cur.slice(0,160)+(cur.length>160?"…":""):"Chưa có nội dung.";
  e.querySelector(".d").value=x.text;
  wire(e,ok=>Store.decideC(x,ok,e.querySelector(".d").value.trim()))})}

/* ===== 12. LỊCH SỬ VÀ BÀI KHẤN CỦA CHÙA ===== */
let itab="h";
function drawInfo(){const t=hallState&&(T[hallState.t.id]||hallState.t);if(!t)return;
 $("itx").textContent=t[itab]||(itab=="h"?"Chưa có lịch sử cho chùa này.":"Chưa có bài khấn cho chùa này.");
 $("ib-h").classList.toggle("on",itab=="h");$("ib-p").classList.toggle("on",itab=="p");
 $("ipb").textContent=(t[itab]?"Đề xuất chỉnh sửa ":"Đề xuất ")+(itab=="h"?"lịch sử":"bài khấn")+" (+"+PTS[itab=="h"?"history":"prayer"]+" điểm khi được duyệt)";
 $("ibox").classList.add("hidden");$("ita").maxLength=itab=="h"?1500:3000}
$("mus").onclick=()=>{muted=!muted;au&&au.mute(muted);$("mus").textContent=muted?"🔇":"🔊"};
$("infob").onclick=()=>{$("info").classList.remove("hidden");drawInfo()};
$("ix").onclick=()=>$("info").classList.add("hidden");
$("ib-h").onclick=()=>{itab="h";drawInfo()};$("ib-p").onclick=()=>{itab="p";drawInfo()};
$("ipb").onclick=()=>{$("ibox").classList.remove("hidden");$("ita").value=""};
$("isend").onclick=async()=>{const x=$("ita").value.trim();if(x.length<20)return toast("Nội dung quá ngắn");
 const t=hallState.t;
 try{await Store.contrib({uid:user.uid,templeId:t.id,t:t.n,kind:itab=="h"?"history":"prayer",text:x,status:"pending",createdAt:Date.now()});toast("Đã gửi, chờ duyệt");$("ibox").classList.add("hidden")}catch(e){toast("Không gửi được, thử lại sau")}};

async function loadHist(){
 const box=$("hist-v");box.textContent="Đang tải…";
 const [vs,ms,p]=await Promise.all([Store.visits(user.uid),Store.myMerits(user.uid),Store.profile(user.uid)]);
 if(p){prof=p;showMe()}box.textContent="";
 const tt=document.createElement("div");tt.innerHTML=`<small class="me">Tổng điểm công đức</small><div class="total"></div>`;tt.querySelector(".total").textContent=prof.points;box.appendChild(tt);
 const K={temple:"Đề xuất chùa",history:"Đề xuất lịch sử",prayer:"Đề xuất bài khấn"},f=x=>new Date(x).toLocaleString("vi-VN");
 const all=[...vs.map(v=>({at:v.start,a:(T[v.templeId]||{n:v.templeId}).n,b:`${f(v.start)} · ${v.mins} phút · +${v.points} điểm`})),...ms.map(m=>({at:m.at,a:K[m.kind]+": "+m.t,b:`${f(m.at)} · +${m.points} điểm`}))].sort((x,y)=>y.at-x.at);
 if(!all.length){const q=document.createElement("p");q.textContent="Bạn chưa có hoạt động nào. Mở Bản đồ và chọn một ngôi chùa để bắt đầu.";box.appendChild(q);return}
 all.forEach(v=>{const e=document.createElement("div");e.className="item";e.innerHTML="<b></b><small></small>";e.querySelector("b").textContent=v.a;e.querySelector("small").textContent=v.b;box.appendChild(e)})
}
